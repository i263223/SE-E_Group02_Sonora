<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="SONORA Vinyl Logo">
  <!-- Outer vinyl disc ring -->
  <circle cx="32" cy="32" r="29" stroke="#FFFFFF" stroke-width="2.5" opacity="0.95" />

  <!-- Concentric groove arcs (white and crimson) -->
  <path d="M 32 8 A 24 24 0 0 1 56 32" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 56 A 24 24 0 0 1 8 32" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" opacity="0.7" />

  <path d="M 14.3 20.5 A 20 20 0 0 1 43.5 14.3" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" opacity="0.85" />
  <path d="M 49.7 43.5 A 20 20 0 0 1 20.5 49.7" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />

  <path d="M 17 32 A 15 15 0 0 1 32 17" stroke="#E11D48" stroke-width="1.75" stroke-linecap="round" />
  <path d="M 47 32 A 15 15 0 0 1 32 47" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

  <circle cx="32" cy="32" r="10.5" stroke="#FFFFFF" stroke-width="1.5" opacity="0.45" />

  <!-- Crimson center spindle / label dot -->
  <circle cx="32" cy="32" r="5" fill="#E11D48" />
  <circle cx="32" cy="32" r="1.75" fill="#121214" />
</svg>
